<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk / Daftar | WeCleanIt Customer Portal</title>
    
    <!-- Google Fonts: Syne & DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkblue: '#0F5A96',
                        skyblue: '#74B4D9',
                        lightsky: '#E0F2FE',
                        neutralbg: '#F0F9FF',
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        heading: ['Syne', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-neutralbg text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Card Container Utama -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-lightsky relative">
        
        <!-- Header Section -->
        <div class="bg-darkblue p-6 text-center text-white relative">
            <div class="absolute inset-0 bg-gradient-to-b from-darkblue to-skyblue opacity-90"></div>
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-16 h-16 bg-white text-skyblue rounded-2xl flex items-center justify-center mb-3 shadow-lg">
                    <i class="fa-solid fa-shield-halved text-3xl"></i>
                </div>
                <h1 class="font-heading text-2xl font-bold tracking-tight">WeCleanIt</h1>
                <p id="header-desc" class="text-lightsky text-sm mt-1 transition-all">Selamat datang kembali!</p>
            </div>
        </div>

        <!-- Form Area -->
        <div class="p-8">

            <!-- ================= VIEW: LOGIN ================= -->
            <div id="view-login" class="block transition-opacity duration-300">
                <form id="form-login" class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-darkblue mb-1">Nomor WhatsApp</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-mobile-screen text-lg"></i>
                            </div>
                            <input type="tel" required placeholder="08123456789" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-skyblue focus:ring-2 focus:ring-lightsky outline-none transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-darkblue mb-1">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <input type="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-skyblue focus:ring-2 focus:ring-lightsky outline-none transition-all">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3 bg-skyblue hover:bg-blue-400 text-white rounded-xl font-bold transition-colors shadow-md shadow-skyblue/30 flex justify-center items-center gap-2">
                        Masuk <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <div class="relative flex items-center py-2">
                        <div class="flex-grow border-t border-gray-200"></div>
                        <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">atau</span>
                        <div class="flex-grow border-t border-gray-200"></div>
                    </div>

                    <button type="button" class="w-full py-3 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 rounded-xl font-bold text-sm transition-colors flex justify-center items-center gap-2">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Lanjutkan dengan Google
                    </button>

                    <p class="text-center text-sm text-gray-600 mt-6">
                        Belum punya akun? 
                        <button type="button" onclick="switchView('register')" class="text-darkblue font-bold hover:underline outline-none">
                            Daftar Sekarang
                        </button>
                    </p>
                </form>
            </div>

            <!-- ================= VIEW: REGISTER ================= -->
            <div id="view-register" class="hidden transition-opacity duration-300">
                <form id="form-register" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-darkblue mb-1">Nama Lengkap</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <input type="text" required placeholder="Budi Santoso" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:border-skyblue focus:ring-2 focus:ring-lightsky outline-none transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-darkblue mb-1">Nomor WhatsApp</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-mobile-screen"></i>
                            </div>
                            <input type="tel" id="reg-phone" required placeholder="08123456789" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:border-skyblue focus:ring-2 focus:ring-lightsky outline-none transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-darkblue mb-1">Alamat Kos / Rumah</label>
                        <div class="relative">
                            <div class="absolute top-3 left-0 pl-3 pointer-events-none text-gray-400">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                            <textarea required rows="2" placeholder="Jl. Majapahit No. 10..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:border-skyblue focus:ring-2 focus:ring-lightsky outline-none transition-all resize-none"></textarea>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-darkblue mb-1">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <input type="password" required placeholder="Buat password" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:border-skyblue focus:ring-2 focus:ring-lightsky outline-none transition-all">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3 mt-2 bg-skyblue hover:bg-blue-400 text-white rounded-xl font-bold transition-colors shadow-md shadow-skyblue/30">
                        Daftar & Verifikasi WA
                    </button>

                    <p class="text-center text-sm text-gray-600 mt-4">
                        Sudah punya akun? 
                        <button type="button" onclick="switchView('login')" class="text-darkblue font-bold hover:underline outline-none">
                            Masuk di sini
                        </button>
                    </p>
                </form>
            </div>

            <!-- ================= VIEW: OTP VERIFICATION ================= -->
            <div id="view-otp" class="hidden text-center transition-opacity duration-300">
                <form id="form-otp" class="space-y-6">
                    <div class="bg-lightsky p-4 rounded-xl text-darkblue text-sm mb-4 border border-skyblue/30">
                        Kami telah mengirimkan 4 digit kode OTP ke WhatsApp Anda: <br>
                        <strong id="otp-phone-display" class="text-lg tracking-wide">08xxx</strong>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-darkblue mb-3">Masukkan Kode OTP</label>
                        <input type="text" maxlength="4" required placeholder="• • • •" class="w-1/2 mx-auto text-center text-2xl tracking-[0.5em] py-3 rounded-xl border border-gray-200 focus:border-skyblue focus:ring-2 focus:ring-lightsky outline-none transition-all font-bold">
                    </div>

                    <button type="submit" class="w-full py-3 bg-darkblue hover:bg-blue-900 text-white rounded-xl font-bold transition-colors shadow-md shadow-darkblue/30">
                        Verifikasi OTP
                    </button>

                    <p class="text-sm text-gray-500">
                        Belum menerima kode? <button type="button" class="text-skyblue font-bold hover:underline outline-none">Kirim ulang</button>
                    </p>
                    
                    <button type="button" onclick="switchView('register')" class="text-sm text-gray-400 hover:text-gray-600 underline mt-4 outline-none">
                        Kembali ke Form Pendaftaran
                    </button>
                </form>
            </div>

        </div>
    </div>

    <!-- Script Logika UI -->
    <script>
        function switchView(viewName) {
            // Sembunyikan semua view
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-register').classList.add('hidden');
            document.getElementById('view-otp').classList.add('hidden');

            // Tampilkan view yang dipilih
            document.getElementById('view-' + viewName).classList.remove('hidden');

            // Ubah teks header
            const headerDesc = document.getElementById('header-desc');
            if(viewName === 'login') {
                headerDesc.textContent = 'Selamat datang kembali!';
            } else if(viewName === 'register') {
                headerDesc.textContent = 'Buat akun baru Anda';
            } else if(viewName === 'otp') {
                headerDesc.textContent = 'Verifikasi nomor WhatsApp';
            }
        }

        // Handle Login
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Simulasi: Login berhasil! (Nantinya akan diarahkan ke Dashboard/index.html)');
        });

        // Handle Register
        document.getElementById('form-register').addEventListener('submit', function(e) {
            e.preventDefault();
            // Ambil nomor HP yang diisi, tampilkan di layar OTP
            const phone = document.getElementById('reg-phone').value;
            document.getElementById('otp-phone-display').textContent = phone || '08xxx';
            
            // Pindah ke layar OTP
            switchView('otp');
        });

        // Handle OTP Verifikasi
        document.getElementById('form-otp').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Simulasi: OTP Berhasil diverifikasi! Akun telah dibuat. Silakan login.');
            switchView('login');
        });
    </script>
</body>
</html>
